<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TalkScript · 重新定义视频字幕的价值</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="hero">
        <h1>TalkScript</h1>
        <p class="subtitle">重新定义视频字幕的价值</p>
      </header>

      <form id="gen-form" class="panel">
        <label class="field">
          <span class="field-label">YouTube 链接</span>
          <input
            id="url"
            type="url"
            placeholder="https://www.youtube.com/watch?v=xRh2sVcNXQ8"
            required
          />
        </label>

        <details class="advanced">
          <summary>生成要求（可选）</summary>
          <textarea
            id="requirement"
            rows="3"
            placeholder="例如：面向产品经理，输出风格专业克制，重点提炼商业模式与定价策略。"
          ></textarea>
        </details>

        <div class="actions">
          <button type="submit" id="submit-btn">生成文章</button>
          <button type="button" id="sample-btn" class="link-btn">填入演示视频</button>
        </div>
      </form>

      <section id="status" class="status" hidden></section>
      <article id="article" class="article" hidden></article>
      <footer id="timing" class="timing" hidden></footer>
    </main>

    <!-- 右侧固定 5W1H 面板：点章节 5W1H 按钮时滑入，显示该章总结。 -->
    <aside id="w5h1-panel" class="w5h1-panel" hidden aria-hidden="true">
      <header class="w5h1-panel-head">
        <span class="w5h1-panel-tag">5W1H</span>
        <h3 id="w5h1-panel-title" class="w5h1-panel-title"></h3>
        <button type="button" id="w5h1-panel-close" class="w5h1-panel-close" aria-label="关闭">×</button>
      </header>
      <div id="w5h1-panel-body" class="w5h1-panel-body"></div>
    </aside>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
